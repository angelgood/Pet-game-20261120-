<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>START｜養寵人生大富翁</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #1f1147 0%, #090418 75%);
            font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }

        .arcade-frame {
            width: 100%;
            max-width: 520px;
            padding: 36px 24px;
            border: 4px solid #00f5d4;
            border-radius: 24px;
            background: rgba(15, 10, 40, 0.85);
            box-shadow: 0 0 25px rgba(0, 245, 212, 0.45), inset 0 0 20px rgba(155, 93, 229, 0.35);
        }

        .tag-line {
            display: inline-block;
            font-size: 0.82rem;
            letter-spacing: 2px;
            color: #fee440;
            border: 1.5px solid #fee440;
            padding: 4px 14px;
            border-radius: 999px;
            margin-bottom: 18px;
        }

        .hero-icon {
            font-size: 84px;
            margin: 8px 0 14px 0;
            filter: drop-shadow(0 0 14px rgba(254, 228, 64, 0.7));
            animation: floatPet 2.2s ease-in-out infinite;
        }

        @keyframes floatPet {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .main-title {
            font-size: 2.1rem;
            font-weight: 900;
            margin: 0 0 8px 0;
            background: linear-gradient(90deg, #00f5d4, #fee440, #f15bb5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .sub-title {
            font-size: 0.95rem;
            color: #cbd5e1;
            margin-bottom: 34px;
            line-height: 1.6;
        }

        .start-btn {
            display: inline-block;
            width: 80%;
            max-width: 280px;
            padding: 18px 0;
            font-size: 1.55rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #090418;
            background: #fee440;
            border: 4px solid #fff;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 8px 0 #b5179e, 0 0 25px rgba(254, 228, 64, 0.7);
            transition: transform 0.12s;
            animation: pulseBtn 1.5s infinite;
        }

        @keyframes pulseBtn {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.04);
            }
        }

        .start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #b5179e;
        }

        .footer-hint {
            margin-top: 26px;
            font-size: 0.78rem;
            color: #94a3b8;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="arcade-frame">
        <div class="tag-line">PET LIFE MONOPOLY</div>
        <div class="hero-icon">🐶</div>
        <h1 class="main-title">養寵人生大富翁</h1>
        <div class="sub-title">
            40 格真實養育預算 × 機會命運 × 照顧決策模擬<br>
            準備好迎接毛孩的一生了嗎？
        </div>

        <button class="start-btn" onclick="location.href='profile.html'">START</button>

        <div class="footer-hint">PRESS START TO BEGIN</div>
    </div>

</body>
</html>
